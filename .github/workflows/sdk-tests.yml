name: SDK Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_openai_integration:
        description: Run the real OpenAI integration scenarios
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run safe SDK tests
        run: python -m pytest tests -q

  openai-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_openai_integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run real OpenAI integration tests
        env:
          RUN_LOGLLAMA_OPENAI_INTEGRATION: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOGLLAMA_OPENAI_TEST_MODEL: gpt-5-nano
        run: python -m pytest tests/integration -m integration -q
