[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logllama"
version = "0.1.0"
description = "Python SDK for capturing LLM API calls in LogLlama."
requires-python = ">=3.10"
authors = [{ name = "LogLlama" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["logllama*"]

