[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logllama"
version = "0.1.0"
description = "LLM observability in two lines of Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LogLlama" }]
license = "MIT"
keywords = ["llm", "observability", "openai", "debugging", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/logllama/logllama"
Repository = "https://github.com/logllama/logllama"

[tool.setuptools.packages.find]
where = ["."]
include = ["logllama*"]
