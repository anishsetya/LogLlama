services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logllama
      POSTGRES_PASSWORD: logllama
      POSTGRES_DB: logllama
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logllama -d logllama"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

